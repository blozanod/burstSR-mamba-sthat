# config.yml — PLAN.md L4: the verdict experiment (oracle-alignment pair).
# Identical to the L3 config except: total_iter 35000 and oracle_align
# true on the training set. oracle_align warps every training frame to
# the reference with the generator's ground-truth flows. Note the official
# val set ships no flows, so validation inputs are NOT oracle-warped in
# either arm; read the L4 verdict primarily from the pair's relative
# numbers and the all-ref ablation on the oracle model (see PLAN.md).
name: MF_STHAT_L4_OracleOn
model_type: MambaFusionModel
scale: 8
num_gpu: 4
manual_seed: 42
find_unused_parameters: false

# Dataset
datasets:
  train:
    name: SyntheticBurst_train
    type: SyntheticBurstDataset
    # Zurich RAW-to-RGB canon set root (expects <dataroot>/train/canon/*.jpg)
    dataroot: /groups/rls/blozanod/MambaFusion/dataset/Zurich-RAW-to-RGB
    num_frames: 14
    phase: train
    scale: 8
    batch_size_per_gpu: 4
    num_worker_per_gpu: 6
    dataset_enlarge_ratio: 1
    oracle_align: true
    grad_clip_norm: 1

  val:
    name: SyntheticBurst_val
    type: SyntheticBurstDataset
    # Official pre-generated 300-burst val set (expects bursts/ and gt/)
    dataroot: /groups/rls/blozanod/MambaFusion/dataset/SyntheticBurstVal
    num_frames: 14
    phase: val
    scale: 8

# Network
network_g:
  type: MambaFusionNet
  # General Config
  global_skip: false
  num_frames: 14
  img_size: 48
  num_feat: 64
  # Alignment Specific Config
  offset_groups: 4
  # Fusion Specific Config
  fusion_ws: 8
  fusion_feat: 96
  fusion_mlp_ratio: 4
  fusion_heads: 4
  fusion_overlap: 0.25
  fusion_depth_s1: 3
  fusion_depth_s3: 3
  # MambaIRv2 Specific Config
  embed_dim: 48
  d_state: 8
  scale: 8
  depths: [5, 5, 5, 5]
  num_heads: [4, 4, 4, 4]
  window_size: 16
  inner_rank: 32
  num_tokens: 64
  convffn_kernel_size: 5
  mlp_ratio: 2
  upsampler: 'pixelshuffle'
  resi_connection: '1conv'
  is_train: true

# Training
path:
  pretrain_network_g: ~
  strict_load_g: true
  resume_state: ~
  experiments_root: ~

train:
  accumulation_steps: 2
  total_iter: 35000
  warmup_iter: 10000
  compand: false  # PLAN.md L3: plain L1 on linear RGB, no mu-law companding

  optim_g:
    type: AdamW
    lr: !!float 1e-4
    weight_decay: 0
    betas: [0.9, 0.99]


  scheduler:
    type: MultiStepLR
    milestones: [35000, 65000, 85000]

  pixel_opt:
    type: L1Loss
    loss_weight: 1.0
    reduction: mean
  # No edge_opt: PLAN.md L3 holds every nonstandard knob at its literature
  # setting; edge terms return later as labeled ablations.

# Validation
val:
  val_freq: 5000
  save_img: false
  metrics:
    psnr_synburst:  # headline: official SyntheticBurst eval (vendored DBSR code)
      type: calculate_psnr_synburst
      boundary_ignore: 40
      better: higher
    psnr_linear:  # ours, kept alongside
      type: calculate_psnr_linear
      crop_border: 40
      test_y_channel: false
      better: higher
    ssim:  # ours (linear-domain SSIM), kept alongside
      type: calculate_ssim
      crop_border: 40
      test_y_channel: false
      better: higher

# Logging
logger:
  print_freq: 100
  save_checkpoint_freq: 5000
  use_tb_logger: false
