# R3D_RCAN3D_NoAlign — one-variable control for R3D_RCAN3D_RAFT.yml: the same
# 3D RCAN (78.58 GMACs, 2.60M params) with `align: none`, i.e. DUF/FSTRN-style
# 3D convs with no explicit motion compensation. The RAFT - NoAlign delta is
# how much registration the stacked 3x3x3 kernels fail to learn on their own
# (SyntheticBurst shifts are up to 3 packed px; the trunk's receptive field is
# ~+/-38 px, so capacity is not the question — the question is whether a
# spatially shared filter bank can do per-burst registration).
# Everything else, including the recipe, is identical: diff the two files.
#
name: R3D_RCAN3D_NoAlign_100k
model_type: MambaFusionModel   # any [B,N,4,h,w] -> [B,3,H,W] arch; flow_opt unset
scale: 8
num_gpu: 4
manual_seed: 42
find_unused_parameters: false

# Dataset
datasets:
  train:
    name: SyntheticBurst_train
    type: SyntheticBurstDataset
    # Zurich RAW-to-RGB canon set root (expects <dataroot>/train/canon/*.jpg)
    dataroot: /groups/rls/blozanod/MambaFusion/dataset/Zurich-RAW-to-RGB
    num_frames: 14
    phase: train
    scale: 8
    batch_size_per_gpu: 8
    num_worker_per_gpu: 6
    dataset_enlarge_ratio: 1
    grad_clip_norm: 1   # MambaFusionModel reads it from here, not train:

  val:
    name: SyntheticBurst_val
    type: SyntheticBurstDataset
    # Official pre-generated 300-burst val set (expects bursts/ and gt/)
    dataroot: /groups/rls/blozanod/MambaFusion/dataset/SyntheticBurstVal
    num_frames: 14
    phase: val
    scale: 8

# Network
network_g:
  type: RCAN3D
  num_frames: 14
  img_size: 48          # packed LR crop; unused by the arch, read by shape_check / count_macs
  in_chans: 4           # packed RGGB
  out_chans: 3          # linear RGB
  num_feat: 48
  num_group: 4
  num_block: 4
  reduction: 8
  temporal_kernel: 3
  spatial_kernel: 3
  res_scale: 1.0
  scale: 8              # packed-LR -> GT; 3 x PixelShuffle(2)
  # Alignment (frozen, excluded from the budget)
  align: none           # control: no explicit alignment
  flow_weights: ~       # local RAFT state_dict; ~ = torchvision download/cache
  flow_iters: 12
  flow_upscale: 4       # RAFT sees 192x192 pseudo-sRGB (it works at 1/8 res)
  is_train: true

# Training
path:
  pretrain_network_g: ~
  strict_load_g: true
  resume_state: ~
  experiments_root: ~

train:
  accumulation_steps: 1  # 8 x 4 GPUs x 1 = effective batch 32, matches L5/L6
  total_iter: 100000
  warmup_iter: 2000
  compand: false  # plain L1 on linear RGB, no mu-law companding

  optim_g:
    type: AdamW
    lr: !!float 1e-4
    weight_decay: 0
    betas: [0.9, 0.99]

  scheduler:
    type: CosineAnnealingRestartLR
    periods: [100000]
    restart_weights: [1]
    eta_min: !!float 1e-6

  pixel_opt:
    type: L1Loss
    loss_weight: 1.0
    reduction: mean

# Validation
val:
  val_freq: 2500
  save_img: false
  metrics:
    psnr_synburst:  # headline: official SyntheticBurst eval (vendored DBSR code)
      type: calculate_psnr_synburst
      boundary_ignore: 40
      better: higher
    psnr_linear:
      type: calculate_psnr_linear
      crop_border: 40
      test_y_channel: false
      better: higher
    ssim:
      type: calculate_ssim
      crop_border: 40
      input_order: CHW
      test_y_channel: false
      better: higher

# Logging
logger:
  print_freq: 100
  save_checkpoint_freq: 5000
  use_tb_logger: false
